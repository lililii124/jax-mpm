name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m examples.gradient
      - run: python -m mpm_jax --frames 2 --substeps 10 --no-render --output outputs/smoke
      - run: python -m examples.suite --case wave --grid 32 --no-render --output outputs/wave
