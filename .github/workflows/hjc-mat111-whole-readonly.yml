name: HJC complete official raw read-only audit
on:
  workflow_dispatch:
    inputs:
      render_private_completed:
        type: choice
        options: ['false','true']
        default: 'false'
      specification:
        type: string
        required: true
        description: Exact parent/child run artifact commit bytes SHA frame and parent_review JSON
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_SPECIFICATION: ${{ inputs.specification }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Fetch exact independently specified parent and child source commits
        run: |
          python - <<'PYCODE'
          import json,os,pathlib,subprocess
          spec=json.loads(os.environ['AUDIT_SPECIFICATION'])
          for role in ('parent','child'):
              commit=spec[role]['commit']
              assert len(commit)==40 and all(x in '0123456789abcdef' for x in commit)
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',commit],check=True)
          pathlib.Path('.local').mkdir(exist_ok=True)
          pathlib.Path('.local/hjc-audit-spec.json').write_text(json.dumps(spec))
          PYCODE
      - name: Install NumPy only
        run: python -m pip install numpy==2.5.4
      - name: Complete official ZIP CRC source state and parent audit zero physical steps
        run: python tools/audit_hjc_complete_prefix.py --specification .local/hjc-audit-spec.json --output .local/hjc40-audit
      - name: Install official ParaView only for private completed-state review
        if: inputs.render_private_completed == 'true'
        run: |
          python -m pip install pillow==13.0.0 psutil==7.2.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libosmesa6
          python - <<'PYCODE'
          from pathlib import Path
          import tools.run_woven_preview as helper
          helper.LOGS=Path('.local/hjc-render-install')
          helper.install()
          PYCODE
      - name: Render actual HJC61 old camera400 no labels no integration
        if: inputs.render_private_completed == 'true'
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import sys
          import tools.run_woven_preview as helper
          helper.LOGS=Path('.local/hjc-render-install')
          helper.command('paraview-private-hjc61',[sys.executable,'tools/render_hjc_mat111_private.py','.local/hjc40-audit','.local/hjc-private-preview'],monitor=True)
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always() && inputs.render_private_completed == 'true'
        with:
          name: hjc61-private-actual-state-review-${{ github.run_id }}
          path: |
            .local/hjc-private-preview/frames/
            .local/hjc-private-preview/*.gif
            .local/hjc-private-preview/*.png
            .local/hjc-private-preview/*.json
            .local/hjc-private-preview/*.log
            .local/hjc-private-preview/*.pvsm
            .local/hjc-render-install/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hjc40-independent-readonly-receipt-${{ github.run_id }}
          path: |
            .local/hjc40-audit/independent-hjc*-review.json
            .local/hjc40-audit/parent/archive-review.json
            .local/hjc40-audit/child/archive-review.json
            .local/hjc40-audit/delivery/delivery-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-final-checkpoint-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/final-checkpoint.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part0-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0000
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part1-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0001
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part2-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0002
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part3-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0003
          compression-level: 0
          if-no-files-found: ignore
