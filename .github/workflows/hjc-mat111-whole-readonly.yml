name: HJC40 complete official raw read-only audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Fetch exact parent and child source commits
        run: |
          git fetch --no-tags --depth=1 origin 52cea038373934b8c80596f5c42518bb37a0e9fc
          git fetch --no-tags --depth=1 origin d857cec8d682446a1f4821ebd0fb3b713ef761a2
      - name: Install NumPy only
        run: python -m pip install numpy==2.5.4
      - name: Complete official ZIP CRC source state and parent audit zero physical steps
        run: python tools/audit_hjc_complete_prefix.py --output .local/hjc40-audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hjc40-independent-readonly-receipt-${{ github.run_id }}
          path: |
            .local/hjc40-audit/independent-hjc40-review.json
            .local/hjc40-audit/parent/archive-review.json
            .local/hjc40-audit/child/archive-review.json
            .local/hjc40-audit/delivery/delivery-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-final-checkpoint-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/final-checkpoint.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part0-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0000
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part1-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0001
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part2-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0002
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: hjc40-render-part3-${{ github.run_id }}
          path: .local/hjc40-audit/delivery/render-data.tar.gz.part-0003
          compression-level: 0
          if-no-files-found: ignore
