name: woven gallery relay

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed coarse preview producer
        type: choice
        options: ['39952807550']
        default: '39952807550'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=11'
      - name: Record the original successful run and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/woven-gallery-input
          gh api repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.source_run }} > .local/woven-gallery-input/source-run.json
          gh api 'repos/'$GITHUB_REPOSITORY'/actions/runs/${{ inputs.source_run }}/artifacts?per_page=100' > .local/woven-gallery-input/source-artifacts.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run }}
          pattern: woven-*-${{ inputs.source_run }}-1
          path: .local/woven-gallery-input/artifacts
          merge-multiple: false
      - name: Verify original records and encode compact GIFs
        run: python tools/pack_woven_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: woven-gallery-${{ inputs.source_run }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/woven-gallery/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
