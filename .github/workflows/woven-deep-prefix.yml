name: Private deep woven impact bounded prefix

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Private bounded RHT impact prefix only
        type: choice
        options: [woven-deep-prefix]
        default: woven-deep-prefix
        required: true

permissions:
  contents: read

concurrency:
  group: woven-deep-prefix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install and record exact numerical runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==2.5.4 jax==0.12.0.1 jaxlib==0.12.0.1 psutil==7.2.2
          python -m pip install --no-deps -e .
      - name: Advance exact default physical plan only through frame 2
        timeout-minutes: 93
        run: python tools/run_woven_deep_prefix.py
      - name: Package complete raw including failure evidence
        if: always()
        timeout-minutes: 10
        run: python tools/run_woven_deep_prefix.py package
      - name: Upload transport manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woven-deep-prefix-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/woven-deep-delivery/transport.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload raw part 000 bounded to 128 MiB
        if: always() && hashFiles('.local/woven-deep-delivery/part-000.tarpart') != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: woven-deep-prefix-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/woven-deep-delivery/part-000.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw part 001 bounded to 128 MiB
        if: always() && hashFiles('.local/woven-deep-delivery/part-001.tarpart') != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: woven-deep-prefix-${{ github.run_id }}-${{ github.run_attempt }}-part-001
          path: .local/woven-deep-delivery/part-001.tarpart
