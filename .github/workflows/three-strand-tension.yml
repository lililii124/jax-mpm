name: independent three helical strand tension stages
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [numerical, media]
        default: numerical
        required: true
      model:
        type: choice
        options: [hertz, jkr]
        default: hertz
      length:
        type: string
        default: '0.024'
      diameter:
        type: string
        default: '0.002'
      pitch:
        type: string
        default: '0.008'
      compactness:
        type: string
        default: '0.985'
      dx:
        type: string
        default: '0.0002'
      spacing:
        type: string
        default: '0.0001'
      stop_after_frame:
        type: choice
        options: ['2', '10', '20', '30', '40', '50', '60']
        default: '2'
        required: true
      parent_artifact_id:
        description: Exact successful whole-raw parent artifact ID, empty for fresh f2
        type: string
        default: ''
      parent_run_id:
        description: Exact successful parent workflow run ID, empty for fresh f2
        type: string
        default: ''
      restore_key:
        description: Logical sealed parent capsule key, not Actions cache storage
        type: string
        default: ''
      parent_receipt:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: three-strand-tension
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      PARENT_ARTIFACT_ID: ${{ inputs.parent_artifact_id }}
      PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      PARENT_KEY: ${{ inputs.restore_key }}
      PARENT_SHA: ${{ inputs.parent_receipt }}
      ROPE_MODEL: ${{ inputs.model }}
      ROPE_LENGTH: ${{ inputs.length }}
      ROPE_DIAMETER: ${{ inputs.diameter }}
      ROPE_PITCH: ${{ inputs.pitch }}
      ROPE_COMPACTNESS: ${{ inputs.compactness }}
      ROPE_DX: ${{ inputs.dx }}
      ROPE_SPACING: ${{ inputs.spacing }}
      END_FRAME: ${{ inputs.stop_after_frame }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install host-only planning dependencies
        run: python -m pip install numpy==2.5.4 scipy==1.18.1 psutil==7.2.2
      - name: Bind unchanged physical plan and exact parent key
        id: prepare
        run: >-
          python tools/run_three_strand_tension.py prepare --stop-after-frame "$END_FRAME"
          --restore-key "$PARENT_KEY" --parent-receipt "$PARENT_SHA"
          --model "$ROPE_MODEL" --length "$ROPE_LENGTH" --diameter "$ROPE_DIAMETER"
          --pitch "$ROPE_PITCH" --compactness "$ROPE_COMPACTNESS" --dx "$ROPE_DX" --spacing "$ROPE_SPACING"
      - uses: actions/download-artifact@v5
        if: inputs.restore_key != ''
        id: restore
        with:
          artifact-ids: ${{ inputs.parent_artifact_id }}
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: .local/three-strand-parent-delivery/
          merge-multiple: true
      - name: Verify exact parent artifact and restore every original raw member before installing lock
        if: inputs.restore_key != ''
        run: |
          python tools/run_three_strand_tension.py restore-parent --parent-receipt "$PARENT_SHA" --restore-key "$PARENT_KEY" --model "$ROPE_MODEL" --length "$ROPE_LENGTH" --diameter "$ROPE_DIAMETER" --pitch "$ROPE_PITCH" --compactness "$ROPE_COMPACTNESS" --dx "$ROPE_DX" --spacing "$ROPE_SPACING"
          python -m pip install -r .local/three-strand-tension-cache/requirements.txt
          python -m pip install --no-deps -e .
      - name: Install initial numerical environment
        if: inputs.restore_key == ''
        run: |
          python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 ml-dtypes==0.6.0 numpy==2.5.4 opt-einsum==3.4.0 pillow==13.0.0 psutil==7.2.2 scipy==1.18.1
          python -m pip install --no-deps -e .
      - name: Compute guarded whole-frame prefix and independent material/raw review
        if: inputs.phase == 'numerical'
        id: numerical
        run: >-
          python tools/run_three_strand_tension.py run --stop-after-frame "$END_FRAME"
          --restore-key "$PARENT_KEY" --parent-receipt "$PARENT_SHA"
          --model "$ROPE_MODEL" --length "$ROPE_LENGTH" --diameter "$ROPE_DIAMETER"
          --pitch "$ROPE_PITCH" --compactness "$ROPE_COMPACTNESS" --dx "$ROPE_DX" --spacing "$ROPE_SPACING"
      - name: Archive every raw byte in bounded192MiB parts
        if: inputs.phase == 'numerical' && steps.numerical.outcome == 'success'
        run: python tools/package_three_strand_raw.py package --cache .local/three-strand-tension-cache --delivery .local/three-strand-raw-delivery
      - uses: actions/upload-artifact@v4
        if: inputs.phase == 'numerical' && steps.numerical.outcome == 'success'
        id: raw_upload
        with:
          name: three-strand-complete-raw-f${{ inputs.stop_after_frame }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/three-strand-raw-delivery/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/download-artifact@v5
        if: inputs.phase == 'numerical' && steps.numerical.outcome == 'success'
        with:
          artifact-ids: ${{ steps.raw_upload.outputs.artifact-id }}
          path: .local/three-strand-raw-retrieved/
          merge-multiple: true
      - name: Independently verify retrieved full raw archive and all members
        if: inputs.phase == 'numerical' && steps.numerical.outcome == 'success'
        run: python tools/package_three_strand_raw.py verify --delivery .local/three-strand-raw-retrieved
      - name: Install real offscreen ParaView
        if: inputs.phase == 'media'
        run: |
          test -n "$PARENT_KEY"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libosmesa6
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import run_woven_preview as p
          p.LOGS=Path('.local/three-strand-pv-install');p.LOGS.mkdir()
          p.install()
          PY
      - name: Render independently accepted full fracture only
        if: inputs.phase == 'media'
        run: python tools/run_three_strand_tension.py render --parent-receipt "$PARENT_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-strand-tension-${{ inputs.phase }}-f${{ inputs.stop_after_frame }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/three-strand-tension-logs/
            .local/three-strand-tension-media/*.json
            .local/three-strand-tension-media/*.csv
            .local/three-strand-tension-media/*.gif
            .local/three-strand-tension-media/*.mp4
            .local/three-strand-tension-media/frames/
            .local/three-strand-retrieval-receipt.json
            .local/three-strand-parent-artifact.json
            .local/three-strand-pv-install/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
      - name: Seal bounded whole failed diagnostic bytes
        if: failure()
        id: diagnostic
        run: python tools/package_three_strand_raw.py diagnostic --cache .local/three-strand-tension-cache --delivery .local/three-strand-failed-delivery
      - uses: actions/upload-artifact@v4
        if: failure() && steps.diagnostic.outcome == 'success'
        id: diagnostic_upload
        with:
          name: three-strand-failed-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/three-strand-failed-delivery/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/download-artifact@v5
        if: failure() && steps.diagnostic_upload.outcome == 'success'
        with:
          artifact-ids: ${{ steps.diagnostic_upload.outputs.artifact-id }}
          path: .local/three-strand-failed-retrieved/
          merge-multiple: true
      - name: Verify retrieved failed diagnostic archive and every original member
        if: failure() && steps.diagnostic_upload.outcome == 'success'
        run: python tools/package_three_strand_raw.py verify --delivery .local/three-strand-failed-retrieved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-strand-diagnostic-retrieval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/three-strand-retrieval-receipt.json
          if-no-files-found: ignore
          retention-days: 30
