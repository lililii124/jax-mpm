name: Ceramic fragmentation original-plan prefix
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prefix]
        default: prefix
permissions:
  contents: read
  actions: read
concurrency:
  group: ceramic-fragmentation-resource-prefix
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - run: python -m pip install -e . psutil
        timeout-minutes: 12
      - name: Bind exact source and numerical environment
        run: |
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path.cwd();cache=root/'.local/ceramic-prefix-cache';records=root/'.local/ceramic-prefix-records'
          cache.mkdir(parents=True);records.mkdir(parents=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert sha==os.environ['GITHUB_SHA']
          names=subprocess.check_output(['git','ls-files','--','mpm_jax','examples','tools','pyproject.toml','.github/workflows/engineering-previews.yml'],text=True).splitlines()
          files={}
          for name in names:
              if not name.endswith(('.py','.toml','.yml')):continue
              raw=(root/name).read_bytes();blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert subprocess.check_output(['git','rev-parse',f'HEAD:{name}'],text=True).strip()==blob
              files[name]={'sha256':hashlib.sha256(raw).hexdigest(),'git_blob':blob,'bytes':len(raw)}
          source={'repository':os.environ['GITHUB_REPOSITORY'],'commit':sha,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':files}
          for folder in (cache,records):(folder/'source.json').write_text(json.dumps(source,indent=2)+'\n')
          (cache/'requirements.txt').write_bytes(subprocess.check_output(['python','-m','pip','freeze']))
          import jax,jaxlib,numpy
          runtime={'python':platform.python_version(),'numpy':numpy.__version__,'jax':jax.__version__,'jaxlib':jaxlib.__version__,'backend':jax.default_backend(),'x64':bool(jax.config.jax_enable_x64)}
          for folder in (cache,records):(folder/'runtime.json').write_text(json.dumps(runtime,indent=2)+'\n')
          PY
      - name: Original ceramic 300 microsecond plan stopped at saved frame 10
        id: solve
        if: inputs.mode == 'prefix'
        timeout-minutes: 30
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import run_engineering_preview as engine
          engine.LOGS=Path('.local/ceramic-prefix-records')
          engine.command('ceramic-prefix',['timeout','--signal=TERM','--kill-after=10s','25m',sys.executable,'-m','examples.ceramic_fragmentation','--stop-after-frame','10','--output','.local/ceramic-prefix-cache/result'],monitor=True)
          engine.command('ceramic-prefix-review',['timeout','--signal=TERM','--kill-after=10s','4m',sys.executable,'tools/review_ceramic_fragmentation.py','.local/ceramic-prefix-cache/result','--allow-prefix'],monitor=True)
          PY
      - name: Seal complete raw prefix or rejected diagnostic
        id: seal
        if: always() && inputs.mode == 'prefix'
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          cache=Path('.local/ceramic-prefix-cache');records=Path('.local/ceramic-prefix-records')
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1048576),b''):h.update(chunk)
              return h.hexdigest()
          source=json.loads((cache/'source.json').read_text())
          for name,entry in source['files'].items():assert digest(Path(name))==entry['sha256'],name
          files={p.relative_to(cache).as_posix():{'bytes':p.stat().st_size,'sha256':digest(p)} for p in sorted(cache.rglob('*')) if p.is_file()}
          assert not any(p.is_symlink() for p in cache.rglob('*')) and sum(e['bytes'] for e in files.values())<2*1024**3
          status=json.loads((cache/'result/status.json').read_text()) if (cache/'result/status.json').exists() else {}
          command=json.loads((records/'ceramic-prefix.json').read_text()) if (records/'ceramic-prefix.json').exists() else {}
          review=json.loads((cache/'result/fragmentation-review.json').read_text()) if (cache/'result/fragmentation-review.json').exists() else {}
          accepted=(command.get('completed') is True and status.get('phase')=='checkpoint-ready' and status.get('segment_complete') is True and status.get('frame')==10 and status.get('frames')==60 and review.get('passed') is True)
          key=f"ceramic-prefix-v1-{source['commit']}-{source['run_id']}-{source['attempt']}-f10"+('' if accepted else '-failed')
          request=urllib.request.Request(f"https://api.github.com/repos/{source['repository']}/actions/cache/usage",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:usage=json.load(response)
          assert usage['active_caches_size_in_bytes']+sum(e['bytes'] for e in files.values())+1048576<=9_000_000_000
          receipt={'schema':'ceramic-resource-prefix-v1','source':source,'files':files,'cache_key':key,'prefix_complete':accepted,'never_resumable':not accepted,'independent_physical_admission':False,'physical_validation_passed':False,'production_eligible':False,'requested_stroke_m':.012,'full_target_s':3e-4,'requested_stop_frame':10,'cache_is_permanent_backup':False,'repository_cache_usage':usage}
          encoded=(json.dumps(receipt,indent=2)+'\n').encode();(cache/'receipt.json').write_bytes(encoded);(records/'receipt.json').write_bytes(encoded)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('cache_key='+key+'\nreceipt_sha='+hashlib.sha256(encoded).hexdigest()+'\n')
          PY
      - name: Save exact raw bytes without replacing another cache
        if: always() && steps.seal.outputs.cache_key != ''
        uses: actions/cache/save@v5
        timeout-minutes: 10
        with:
          path: .local/ceramic-prefix-cache
          key: ${{ steps.seal.outputs.cache_key }}
      - name: Confirm the saved key exists
        id: lookup
        if: always() && steps.seal.outputs.cache_key != ''
        uses: actions/cache/restore@v5
        with:
          path: .local/ceramic-prefix-cache
          key: ${{ steps.seal.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Record exact cache lookup
        if: always() && steps.lookup.outcome == 'success'
        env:
          EXPECTED: ${{ steps.seal.outputs.cache_key }}
          ACTUAL: ${{ steps.lookup.outputs.cache-matched-key }}
          EXACT: ${{ steps.lookup.outputs.cache-hit }}
          RECEIPT_SHA: ${{ steps.seal.outputs.receipt_sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          assert os.environ['EXPECTED']==os.environ['ACTUAL'] and os.environ['EXACT']=='true'
          raw=Path('.local/ceramic-prefix-cache/receipt.json').read_bytes();assert hashlib.sha256(raw).hexdigest()==os.environ['RECEIPT_SHA']
          Path('.local/ceramic-prefix-records/cache-confirmation.json').write_text(json.dumps({'key':os.environ['ACTUAL'],'receipt_sha256':os.environ['RECEIPT_SHA'],'exact_lookup':True,'permanent_backup':False},indent=2)+'\n')
          PY
      - name: Preserve bounded whole evidence files
        if: always()
        timeout-minutes: 6
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          destination=Path('.local/ceramic-prefix-delivery');destination.mkdir()
          candidates=[(p,Path('records')/p.name) for p in sorted(Path('.local/ceramic-prefix-records').glob('*')) if p.is_file()]
          result=Path('.local/ceramic-prefix-cache/result')
          names=['plan.json','summary.json','status.json','segment.json','fragmentation-review.json','failure.json','checkpoint.json','observables.csv','diagnostics.csv','checkpoint_0_0.npz','checkpoint_1_0.npz','final_state_0.npz','reference.npz','particle_fields.npz','trajectory.npz']
          candidates += [(result/name,Path('result')/name) for name in names if (result/name).is_file()]
          candidates += [(p,Path('result')/p.relative_to(result)) for p in sorted(result.rglob('*')) if p.is_file() and p.relative_to(result).as_posix() not in names]
          files={};omitted={};used=0
          for p,relative in candidates:
              h=hashlib.sha256()
              with p.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1048576),b''):h.update(chunk)
              entry={'bytes':p.stat().st_size,'sha256':h.hexdigest()}
              if used+entry['bytes']>191*1024**2:omitted[relative.as_posix()]=entry;continue
              target=destination/relative;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target);files[relative.as_posix()]=entry;used+=entry['bytes']
          (destination/'manifest.json').write_text(json.dumps({'files':files,'omitted':omitted,'physical_validation_passed':False,'production_eligible':False,'media_created':False,'scope':'Listed whole files; omitted raw arrays remain only in an exact-key temporary cache if confirmed.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceramic-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ceramic-prefix-delivery
          include-hidden-files: true
          retention-days: 2
          compression-level: 0
