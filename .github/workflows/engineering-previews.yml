name: private JKR compliant pull-off bounded pilot
on:
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [jkr]
        default: jkr
        required: true
      endpoint:
        type: choice
        options: [prefix, segment]
        default: prefix
        required: true
      stop_after_frame:
        type: string
        default: '2'
      parent_run_id:
        type: string
        default: ''
      parent_artifact_id:
        type: string
        default: ''
      segment_timeout_seconds:
        type: choice
        options: ['1800', '3600', '7200']
        default: '1800'
permissions:
  contents: read
  actions: read
concurrency:
  group: jkr-compliant-pilot-${{ inputs.model }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PILOT_MODEL: ${{ inputs.model }}
      PILOT_ENDPOINT: ${{ inputs.endpoint }}
      PILOT_STOP: ${{ inputs.stop_after_frame }}
      PILOT_TIMEOUT: ${{ inputs.segment_timeout_seconds }}
      PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      PARENT_ARTIFACT_ID: ${{ inputs.parent_artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Fixed numerical environment
        run: |
          python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 ml-dtypes==0.6.0 numpy==2.5.4 opt-einsum==3.4.0 pillow==13.0.0 psutil==7.2.2 scipy==1.18.1
      - name: Freeze isolated source and common physical request
        run: python tools/run_jkr_compliant_pilot.py prepare --root .local/jkr-compliant-linux-pilot
      - uses: actions/download-artifact@v5
        if: inputs.parent_artifact_id != ''
        with:
          artifact-ids: ${{ inputs.parent_artifact_id }}
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: .local/jkr-parent-retrieved
          merge-multiple: true
      - name: Verify complete parent source physical request raw records and material state
        if: inputs.parent_artifact_id != ''
        run: python tools/run_jkr_compliant_pilot.py restore --root .local/jkr-compliant-linux-pilot --parent .local/jkr-parent-retrieved
      - name: Actual202240-particle64-step resource and stability prefix
        if: inputs.parent_artifact_id == ''
        run: python tools/run_jkr_compliant_pilot.py run --root .local/jkr-compliant-linux-pilot --model "$PILOT_MODEL" --stage prefix --timeout 180
      - name: Bounded actual segment only after numerical parent admission
        if: inputs.endpoint == 'segment'
        run: python tools/run_jkr_compliant_pilot.py run --root .local/jkr-compliant-linux-pilot --model "$PILOT_MODEL" --stage segment --stop-after-frame "$PILOT_STOP" --timeout "$PILOT_TIMEOUT"
      - name: Record exact workflow controller
        if: always()
        run: |
          mkdir -p .local/jkr-compliant-linux-pilot/controller
          git rev-parse HEAD > .local/jkr-compliant-linux-pilot/controller/commit.txt
          sha256sum tools/run_jkr_compliant_pilot.py .github/workflows/jkr-compliant-pilot.yml > .local/jkr-compliant-linux-pilot/controller/files.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-jkr-compliant-${{ inputs.model }}-${{ inputs.endpoint }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/jkr-compliant-linux-pilot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
