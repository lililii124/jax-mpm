name: isolated AT2 three-point bending candidate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate qualification only
        type: choice
        options: [smoke, medium]
        default: smoke
permissions:
  contents: read
  actions: read
concurrency:
  group: phase-field-three-point-bending-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/work/phase-field-bending'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install qualification runtime
        run: python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 numpy==2.5.4 scipy==1.18.1 ml-dtypes==0.6.0 opt-einsum==3.4.0 psutil==7.2.2 pillow==13.0.0
      - name: Bounded candidate run (no publication or solver certificate)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python tools/run_phase_field_bending.py
      - name: Preserve partial or completed raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at2-bending-candidate-${{ github.run_id }}
          path: outputs/at2-bending/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
