name: Preserve original rejected metal state
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: metal-impact-resource-prefix
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 07f35f678d60c881701d22dfd0ab4629ea8ee6c4
          path: producer
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - uses: actions/cache/restore@v5
        id: restore
        with:
          path: .local/metal-prefix-cache
          key: metal-prefix-v1-07f35f678d60c881701d22dfd0ab4629ea8ee6c4-40064802642-1-f8-failed
          fail-on-cache-miss: true
      - name: Verify original source and complete failed cache before copying one state
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path,PurePosixPath
          cache=Path('.local/metal-prefix-cache');producer=Path('producer');out=Path('.local/metal-rejected-delivery');out.mkdir()
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):h.update(b)
              return h.hexdigest()
          assert os.environ['CACHE_HIT']=='true' and os.environ['CACHE_KEY']=='metal-prefix-v1-07f35f678d60c881701d22dfd0ab4629ea8ee6c4-40064802642-1-f8-failed'
          raw=(cache/'receipt.json').read_bytes();assert hashlib.sha256(raw).hexdigest()=='561fc8257641b42e8db37dea2317e15e681646131498996e30f5b486cb33b889'
          receipt=json.loads(raw);assert receipt['cache_key']=='metal-prefix-v1-07f35f678d60c881701d22dfd0ab4629ea8ee6c4-40064802642-1-f8-failed' and receipt['never_resumable'] is True and receipt['prefix_complete'] is False
          actual={p.relative_to(cache).as_posix() for p in cache.rglob('*') if p.is_file()};assert actual==set(receipt['files'])|{'receipt.json'}
          assert not any(p.is_symlink() for p in cache.rglob('*'))
          for name,record in receipt['files'].items():
              rel=PurePosixPath(name);assert not rel.is_absolute() and '..' not in rel.parts and ':' not in name and '\\' not in name
              p=cache/name;assert p.stat().st_size==record['bytes'] and digest(p)==record['sha256'],name
          source=receipt['source'];assert source==json.loads((cache/'source.json').read_text()) and source['commit']=='07f35f678d60c881701d22dfd0ab4629ea8ee6c4' and str(source['run_id'])=='40064802642'
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=producer,text=True).strip()=='07f35f678d60c881701d22dfd0ab4629ea8ee6c4'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=producer,text=True).strip()==source['tree']
          for name,r in source['files'].items():
              p=producer/name;data=p.read_bytes();blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert len(data)==r['bytes'] and hashlib.sha256(data).hexdigest()==r['sha256'] and blob==r['git_blob']
              assert subprocess.check_output(['git','rev-parse','HEAD:'+name],cwd=producer,text=True).strip()==blob
          selected=['receipt.json','source.json','runtime.json','result/failure.json','result/status.json','result/summary.json','result/failed_state.npz']
          files={}
          for name in selected:
              p=cache/name
              if not p.is_file():continue
              target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
              r={'bytes':p.stat().st_size,'sha256':digest(p)};assert target.stat().st_size==r['bytes'] and digest(target)==r['sha256'];files[name]=r
          assert files['result/failed_state.npz']==receipt['files']['result/failed_state.npz']
          assert sum(x['bytes'] for x in files.values())<100*1024**2
          manifest={'files':files,'omitted':{},'producer':source,'controller':{'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']},'original_receipt_sha256':'561fc8257641b42e8db37dea2317e15e681646131498996e30f5b486cb33b889','cache_key':'metal-prefix-v1-07f35f678d60c881701d22dfd0ab4629ea8ee6c4-40064802642-1-f8-failed','whole_original_cache_verified':True,'selected_complete_state_only':True,'never_resumable':True,'numerical_execution':False,'scope':'Read-only extraction of original rejected state; original failure and raw cache unchanged. No model verdict changed.'}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metal-rejected-state-40064802642-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/metal-rejected-delivery
          include-hidden-files: true
          retention-days: 2
          compression-level: 0
