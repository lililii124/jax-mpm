name: ceramic failed full review probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceramic-failed-full-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/work/ceramic-fragmentation-prefix'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out diagnostic controller and historical controller objects
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out immutable original numerical source for byte verification only
        uses: actions/checkout@v7
        with:
          ref: 68c311813b11124459b7750f52695c7caa9b6c39
          path: .local/ceramic-frozen-solver
          persist-credentials: false
      - name: Restore exact sealed failed cache without prefix fallback
        id: raw
        uses: actions/cache/restore@v5
        with:
          path: .local/ceramic-prefix-cache
          key: ceramic-continuation-v1-68c311813b11124459b7750f52695c7caa9b6c39-df50b47ab8fcda24a924f196b1348609b34f63b9-40069099744-1-f60-failed
          fail-on-cache-miss: true
      - name: Require exact immutable key
        env:
          CACHE_HIT: ${{ steps.raw.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.raw.outputs.cache-matched-key }}
        run: |
          test "$CACHE_HIT" = true
          test "$CACHE_KEY" = ceramic-continuation-v1-68c311813b11124459b7750f52695c7caa9b6c39-df50b47ab8fcda24a924f196b1348609b34f63b9-40069099744-1-f60-failed
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install original review-only NumPy dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.4
      - name: Save original full physical gates and independent spatial diagnosis without solver execution
        timeout-minutes: 20
        run: python tools/probe_ceramic_full_review.py
      - name: Preserve diagnostic reports even on integrity or reviewer failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceramic-full-review-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ceramic-full-review-probe
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
