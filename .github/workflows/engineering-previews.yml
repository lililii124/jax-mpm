name: HJC MAT111 beam prefix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hjc-mat111-beam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned CPU environment
        timeout-minutes: 15
        run: python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 numpy==2.5.4 scipy==1.18.1 ml-dtypes==0.6.0 opt-einsum==3.4.0 psutil==7.2.2 pillow==13.0.0
      - name: Solve prefix and check saved states
        timeout-minutes: 32
        run: python tools/run_hjc_mat111_beam.py --stop-frame 4
      - name: Preserve raw prefix and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hjc-mat111-beam-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/hjc-mat111-qualification/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
