name: private radial sinusoidal continuation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: radial-sinusoidal-immutable-continuation
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: de2bfea446e66e6245e33329a663996c5d5b9e84
          path: .local/radial-immutable-producer
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install immutable numerical runtime
        timeout-minutes: 10
        run: |
          python -m pip install -r .local/radial-immutable-producer/tools/radial_sinusoidal_runtime.txt
          python -m pip install --no-deps -e .local/radial-immutable-producer
      - name: Admit complete raw workcopy transport and retrieval disk budget
        run: |
          python - <<'PY'
          import shutil,subprocess
          if shutil.disk_usage('.').free < 32*1024**3:
              subprocess.run(['sudo','rm','-rf','--','/usr/local/lib/android','/usr/share/dotnet'],check=True)
          assert shutil.disk_usage('.').free >= 32*1024**3
          PY
      - name: Restore exact independently admitted parent without fallback
        uses: actions/cache/restore@v5
        with:
          path: .local/radial-sinusoidal-full
          key: radial-sinusoidal-v1-2363a43cf6afbd771833e035e0b7703ecd6ff6651306984ca2e7ebf828f2961d-40090780381-1
          fail-on-cache-miss: true
      - name: Retrieve exact independent f10 admission proof artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: '40092005172'
          artifact-ids: '12559346521'
          path: .local/radial-independent-proof
          merge-multiple: true
      - name: Continue immutable producer only from f10 through f50
        id: continuation
        timeout-minutes: 245
        run: python tools/radial_sinusoidal_continuation.py continue
      - name: Preserve complete fresh continuation cache including failed raw
        if: always() && steps.continuation.outputs.cache_key != ''
        timeout-minutes: 10
        uses: actions/cache/save@v5
        with:
          path: .local/radial-immutable-producer/.local/radial-sinusoidal-full
          key: ${{ steps.continuation.outputs.cache_key }}
      - name: Package all continuation evidence without pruning failed raw
        if: always()
        timeout-minutes: 10
        run: python tools/radial_sinusoidal_continuation.py package
      - uses: actions/upload-artifact@v4
        if: always()
        id: manifest
        with:
          name: radial-cont-raw-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/radial-continuation-parts/transport.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/radial-continuation-parts/part-000.tarpart') != ''
        id: part000
        timeout-minutes: 3
        with:
          name: radial-cont-raw-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/radial-continuation-parts/part-000.tarpart
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
