        with:
          name: radial-cont-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/radial-immutable-producer/.local/radial-sinusoidal-full/continuation-receipt.json
            .local/radial-continuation-retrieved/retrieval-receipt.json
            .local/radial-cont-artifact-identities.json
          if-no-files-found: warn
          retention-days: 30
