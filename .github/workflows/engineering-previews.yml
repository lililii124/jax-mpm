name: Fresh corrected-source 5000 m per s prefix
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: metal-impact-resource-prefix
  cancel-in-progress: false
jobs:
  fresh-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install the previously recorded CPU numerical runtime
        timeout-minutes: 10
        run: |
          python -m pip install --only-binary=:all: iniconfig==2.3.1 jax==0.12.0.1 jaxlib==0.12.0.1 ml_dtypes==0.6.0 numpy==2.5.4 opt_einsum==3.4.0 packaging==26.3 pillow==13.0.0 pluggy==1.7.0 psutil==7.2.2 Pygments==2.21.0 pytest==9.1.1 scipy==1.18.1
      - name: Bind new source and review unchanged full physical protocol
        run: python tools/run_metal_corrected_prefix.py prepare
      - name: Fresh t0 prefix to f8 under 20 minute and 6 GiB guards
        timeout-minutes: 22
        run: python tools/run_metal_corrected_prefix.py run
      - name: Seal new-source accepted checkpoint or raw failure
        id: seal
        if: always()
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/run_metal_corrected_prefix.py seal
      - name: Save unique new-source raw cache only within repository budget
        if: always() && steps.seal.outputs.cache_key != ''
        uses: actions/cache/save@v5
        timeout-minutes: 8
        with:
          path: .local/metal-corrected-prefix-cache
          key: ${{ steps.seal.outputs.cache_key }}
      - name: Confirm only the newly written exact cache key
        id: lookup
        if: always() && steps.seal.outputs.cache_key != ''
        uses: actions/cache/restore@v5
        with:
          path: .local/metal-corrected-prefix-cache
          key: ${{ steps.seal.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Bind exact new cache lookup and receipt
        if: always() && steps.lookup.outcome == 'success'
        env:
          EXPECTED: ${{ steps.seal.outputs.cache_key }}
          ACTUAL: ${{ steps.lookup.outputs.cache-matched-key }}
          EXACT: ${{ steps.lookup.outputs.cache-hit }}
          RECEIPT_SHA: ${{ steps.seal.outputs.receipt_sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          assert os.environ['EXPECTED']==os.environ['ACTUAL'] and os.environ['EXACT']=='true'
          assert os.environ['EXPECTED'].startswith('metal-corrected-prefix-v1-'+os.environ['GITHUB_SHA']+'-')
          raw=Path('.local/metal-corrected-prefix-cache/receipt.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['RECEIPT_SHA']
          Path('.local/metal-corrected-prefix-records/cache-confirmation.json').write_text(json.dumps({'key':os.environ['ACTUAL'],'receipt_sha256':os.environ['RECEIPT_SHA'],'exact_lookup':True,'permanent_backup':False},indent=2)+'\n')
          PY
      - name: Deliver bounded complete files including raw rejection first
        if: always()
        timeout-minutes: 6
        run: python tools/run_metal_corrected_prefix.py deliver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-corrected-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/metal-corrected-prefix-delivery
          include-hidden-files: true
          retention-days: 2
          compression-level: 0
