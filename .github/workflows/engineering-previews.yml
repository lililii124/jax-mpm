name: Private deep woven impact exact f34 to f60

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Exact accepted deep woven f34 to f60 continuation
        type: choice
        options: [woven-deep-f34-resume]
        default: woven-deep-f34-resume
        required: true
      mode:
        description: Continuation or separate admitted incomplete particle-only review
        type: choice
        options: [resume, prefix-review]
        default: resume
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: woven-deep-f34-resume-${{ github.ref }}-${{ inputs.mode || 'resume' }}
  cancel-in-progress: false

jobs:
  prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install and record exact numerical runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==2.5.4 jax==0.12.0.1 jaxlib==0.12.0.1 psutil==7.2.2
          python -m pip install --no-deps -e .
      - name: Retrieve immutable accepted parent run only
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: 40113303961
          pattern: woven-deep-f60-40113303961-1-*
          path: .local/woven-deep-f34-parent/
          merge-multiple: true
      - name: Advance exact default physical plan only through frame 60
        if: inputs.mode != 'prefix-review'
        timeout-minutes: 120
        run: python tools/run_woven_deep_f34_resume.py
      - name: Install ParaView only for separate prefix review
        if: inputs.mode == 'prefix-review'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libosmesa6 libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 libxi6 libsm6 libice6
          python -m pip install pillow==12.0.0
          python tools/run_woven_preview.py install
      - name: Review actual saved frames 0 through 34 without solving
        if: inputs.mode == 'prefix-review'
        timeout-minutes: 60
        run: python tools/review_woven_deep_f34_prefix.py
      - name: Upload incomplete particle-only prefix review
        if: inputs.mode == 'prefix-review' && success()
        uses: actions/upload-artifact@v4
        with:
          name: woven-deep-f34-prefix-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/woven-deep-f34-prefix-review/simulation.gif
            .local/woven-deep-f34-prefix-review/prefix-review-admission.json
            .local/woven-deep-f34-prefix-review/render.json
            .local/woven-deep-f34-prefix-review/render.log
            .local/woven-deep-f34-prefix-review/summary.json
            .local/woven-deep-f34-prefix-review/gif-check.json
            .local/woven-deep-f34-prefix-review/paraview-readback.json
          if-no-files-found: error
          retention-days: 7
      - name: Package complete raw including failure evidence
        if: always()
        timeout-minutes: 10
        run: python tools/run_woven_deep_f34_resume.py package
      - name: Upload transport manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woven-deep-f34-resume-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/woven-deep-f34-delivery/transport.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload raw part 000 bounded to 128 MiB
        if: always() && hashFiles('.local/woven-deep-f34-delivery/part-000.tarpart') != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: woven-deep-f34-resume-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/woven-deep-f34-delivery/part-000.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw part 001 bounded to 128 MiB
