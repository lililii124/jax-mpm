name: Ceramic original-source continuation
on:
  workflow_dispatch:
    inputs:
      parent_key:
        type: string
        required: true
        description: Exact accepted recovery or continuation key; failed keys are rejected
      parent_receipt_sha256:
        type: string
        required: true
      from_frame:
        type: number
        default: 10
      end_frame:
        type: number
        default: 60
permissions:
  contents: read
  actions: read
concurrency:
  group: ceramic-fragmentation-resource-prefix
  cancel-in-progress: false
jobs:
  continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Start the whole-job clock
        run: echo "CERAMIC_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the immutable original numerical producer
        uses: actions/checkout@v7
        with:
          ref: 68c311813b11124459b7750f52695c7caa9b6c39
          path: .local/ceramic-frozen-solver
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Restore only the admitted exact cache
        id: restore
        uses: actions/cache/restore@v5
        timeout-minutes: 12
        with:
          path: .local/ceramic-prefix-cache
          key: ${{ inputs.parent_key }}
          fail-on-cache-miss: true
      - name: Validate original bytes and source before installing anything
        id: prepare
        timeout-minutes: 10
        env:
          PARENT_KEY: ${{ inputs.parent_key }}
          RECEIPT_SHA: ${{ inputs.parent_receipt_sha256 }}
          FROM_FRAME: ${{ inputs.from_frame }}
          END_FRAME: ${{ inputs.end_frame }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.restore.outputs.cache-matched-key }}
        run: >-
          python tools/run_ceramic_continuation.py prepare
          --parent-key "$PARENT_KEY" --receipt-sha "$RECEIPT_SHA"
          --from-frame "$FROM_FRAME" --end-frame "$END_FRAME"
      - name: Check repository cache headroom
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/run_ceramic_continuation.py cache-admission --cache-phase initial
      - name: Install only recorded pins and the original numerical checkout
        timeout-minutes: 15
        run: |
          python -m pip install --requirement .local/ceramic-continuation-records/requirements.txt
          python -m pip install --no-deps -e .local/ceramic-frozen-solver
      - name: Validate the original prefix and advance the unchanged full plan
        id: advance
        timeout-minutes: 315
        run: python tools/run_ceramic_continuation.py run
      - name: Preserve a rejected state as nonresumable diagnostic data
        id: failed
        if: failure() && steps.prepare.outcome == 'success' && steps.advance.outcome != 'success'
        timeout-minutes: 8
        run: python tools/run_ceramic_continuation.py seal-failure
      - name: Check exact snapshot cache budget before saving
        id: budget
        if: always() && (steps.advance.outputs.cache_key != '' || steps.failed.outputs.cache_key != '')
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/run_ceramic_continuation.py cache-admission --cache-phase before-save
      - name: Save complete raw bytes under a new immutable key
        id: save
        if: always() && steps.budget.outcome == 'success'
        uses: actions/cache/save@v5
        timeout-minutes: 13
        with:
          path: .local/ceramic-prefix-cache
          key: ${{ steps.advance.outputs.cache_key || steps.failed.outputs.cache_key }}
      - name: Confirm the exact newly saved key
        id: lookup
        if: always() && steps.save.outcome == 'success'
        uses: actions/cache/restore@v5
        with:
          path: .local/ceramic-prefix-cache
          key: ${{ steps.advance.outputs.cache_key || steps.failed.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Bind cache lookup to the sealed receipt
        if: always() && steps.lookup.outcome == 'success'
        timeout-minutes: 5
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.lookup.outputs.cache-matched-key }}
        run: python tools/run_ceramic_continuation.py confirm-cache
      - name: Preserve bounded complete evidence files
        if: always()
        timeout-minutes: 8
        run: python tools/run_ceramic_continuation.py package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceramic-continuation-f${{ inputs.end_frame }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ceramic-continuation-delivery
          include-hidden-files: true
          retention-days: 2
          compression-level: 0
