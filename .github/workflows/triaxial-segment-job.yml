name: one triaxial segment

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      stage:
        type: number
        required: true
      theta:
        type: string
        required: true
      law:
        type: string
        required: true
      contact_regions:
        type: string
        default: single
      load_transits:
        type: string
        required: true
      size:
        type: string
        required: true
      parent_receipt:
        type: string
        default: ''
    outputs:
      receipt_sha:
        description: Hash of the exact sealed data receipt, only after cache save verification
        value: ${{ jobs.segment.outputs.receipt_sha }}

permissions:
  contents: read

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      receipt_sha: ${{ steps.saved.outputs.receipt_sha }}
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUNBUFFERED: '1'
      SEGMENT_MODE: ${{ inputs.mode }}
      SEGMENT_STAGE: ${{ inputs.stage }}
      SEGMENT_THETA: ${{ inputs.theta }}
      SEGMENT_LAW: ${{ inputs.law }}
      SEGMENT_REGIONS: ${{ inputs.contact_regions }}
      SEGMENT_TRANSITS: ${{ inputs.load_transits }}
      SEGMENT_SIZE: ${{ inputs.size }}
      SEGMENT_PARENT: ${{ inputs.parent_receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Resolve immutable request and exact cache identity
        id: prepare
        run: >-
          python tools/run_triaxial_segments.py prepare
          --mode "$SEGMENT_MODE" --stage "$SEGMENT_STAGE"
          --theta "$SEGMENT_THETA" --law "$SEGMENT_LAW"
          --contact-regions "$SEGMENT_REGIONS"
          --load-transits "$SEGMENT_TRANSITS" --size "$SEGMENT_SIZE"
          --parent-receipt "$SEGMENT_PARENT"
      - name: Restore only the preceding exact snapshot
        id: restore
        if: inputs.stage > 1
        uses: actions/cache/restore@v5
        with:
          path: .local/triaxial-segment-cache
          key: ${{ steps.prepare.outputs.parent_key }}
          fail-on-cache-miss: true
      - name: Reject fallback hits and verify all restored bytes before installation or continuation
        if: inputs.stage > 1
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.restore.outputs.cache-matched-key }}
          EXPECTED_KEY: ${{ steps.prepare.outputs.parent_key }}
        run: |
          test "$CACHE_HIT" = true
          test "$CACHE_MATCH" = "$EXPECTED_KEY"
          python tools/run_triaxial_segments.py verify
      - name: Install first-stage numerical environment
        if: inputs.stage == 1
        timeout-minutes: 15
        run: python -m pip install -e . psutil
      - name: Restore exactly pinned numerical distributions
        if: inputs.stage > 1
        timeout-minutes: 15
        run: |
          python -m pip install -r .local/triaxial-segment-cache/runtime/requirements.txt
          python -m pip install --no-deps -e .
      - name: Lock or verify the Python and scientific runtime
        run: python tools/run_triaxial_segments.py lock
      - name: Advance to the planned saved frame and seal the raw snapshot
        if: inputs.stage < 4
        id: run
        timeout-minutes: 300
        run: python tools/run_triaxial_segments.py run
      - name: Save the complete raw continuation snapshot
        if: inputs.stage < 4
        timeout-minutes: 20
        uses: actions/cache/save@v5
        with:
          path: .local/triaxial-segment-cache
          key: ${{ steps.prepare.outputs.cache_key }}
      - name: Verify that the exact new cache is available
        if: inputs.stage < 4
        id: lookup
        uses: actions/cache/restore@v5
        with:
          path: .local/triaxial-segment-cache
          key: ${{ steps.prepare.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Release receipt to the dependent job only after exact save verification
        if: inputs.stage < 4
        id: saved
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.lookup.outputs.cache-matched-key }}
          EXPECTED_KEY: ${{ steps.prepare.outputs.cache_key }}
          RECEIPT_SHA: ${{ steps.run.outputs.receipt_sha }}
        run: |
          test "$CACHE_HIT" = true
          test "$CACHE_MATCH" = "$EXPECTED_KEY"
          test -n "$RECEIPT_SHA"
          python tools/run_triaxial_segments.py confirm-cache
      - name: Admit the complete finalization budget after raw cache save
        if: inputs.stage == 4
        run: python tools/run_triaxial_segments.py admit-finalize
      - name: Preserve rejected raw state under a never-resumable diagnostic key
        id: failed
        if: ${{ always() && inputs.stage < 4 && steps.run.outcome == 'failure' }}
        timeout-minutes: 8
        run: python tools/run_triaxial_segments.py seal-failure
      - name: Save original failed raw history without admitting the next job
        id: failed-save
        if: ${{ always() && steps.failed.outcome == 'success' }}
        timeout-minutes: 20
        uses: actions/cache/save@v5
        with:
          path: .local/triaxial-segment-cache
          key: ${{ steps.failed.outputs.cache_key }}
      - name: Verify exact diagnostic cache availability
        id: failed-lookup
        if: ${{ always() && steps.failed-save.outcome == 'success' }}
        uses: actions/cache/restore@v5
        with:
          path: .local/triaxial-segment-cache
          key: ${{ steps.failed.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Bind diagnostic receipt without releasing a continuation receipt
        if: ${{ always() && steps.failed-lookup.outcome == 'success' }}
        env:
          CACHE_HIT: ${{ steps.failed-lookup.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.failed-lookup.outputs.cache-matched-key }}
          RECEIPT_SHA: ${{ steps.failed.outputs.receipt_sha }}
        run: python tools/run_triaxial_segments.py confirm-diagnostic
      - name: Install final-stage rendering dependencies
        if: inputs.stage == 4 && inputs.mode == 'formal'
        timeout-minutes: 30
        run: python tools/install_runner_dependencies.py --log-dir .local/triaxial-segment-ci
      - name: Verify runtime remained pinned after dependency installation
        if: inputs.stage == 4 && inputs.mode == 'formal'
        run: python tools/run_triaxial_segments.py lock
      - name: Install official ParaView for the complete result
        if: inputs.stage == 4 && inputs.mode == 'formal'
        timeout-minutes: 15
        run: python tools/run_triaxial_segments.py install
      - name: Independently review final history and render, or verify real tiny continuation parity
        if: inputs.stage == 4
        timeout-minutes: 50
        run: python tools/run_triaxial_segments.py finalize
      - name: Archive bounded numerical evidence even on failure
        if: always()
        timeout-minutes: 6
        run: python tools/run_triaxial_segments.py package
      - name: Upload records and complete bounded state files without publication
        if: always()
        timeout-minutes: 9
        uses: actions/upload-artifact@v4
        with:
          name: triaxial-segment-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/triaxial-segment-delivery/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
