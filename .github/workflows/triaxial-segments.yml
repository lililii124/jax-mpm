name: triaxial segmented studies

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Formal runs after the continuation check passes
        type: choice
        options: [tiny, formal]
        default: tiny
        required: true
      theta:
        description: Load angle; tiny requires 0
        type: choice
        options: ['0', '5', '10', '15', '20', '25', '30']
        default: '0'
        required: true
      law:
        type: choice
        options: [hertz, jkr]
        default: hertz
        required: true
      contact_regions:
        description: Connected regions use Hertz only; first run the fresh tiny continuation check
        type: choice
        options: [single, connected]
        default: single
        required: true
      load_transits:
        description: Formal positive transit count at most 100; tiny requires default 10 and internally uses 0.03
        type: string
        default: '10'
        required: true
      size:
        description: Formal dimensions; tiny requires default 24x16 and internally uses 6x4 mm
        type: choice
        options: [20x14, 24x16, 28x18]
        default: 24x16
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: triaxial-segmented-study-cache
  cancel-in-progress: false

jobs:
  first:
    uses: ./.github/workflows/triaxial-segment-job.yml
    with:
      mode: ${{ inputs.mode }}
      stage: 1
      theta: ${{ inputs.theta }}
      law: ${{ inputs.law }}
      contact_regions: ${{ inputs.contact_regions }}
      load_transits: ${{ inputs.load_transits }}
      size: ${{ inputs.size }}
  second:
    needs: first
    uses: ./.github/workflows/triaxial-segment-job.yml
    with:
      mode: ${{ inputs.mode }}
      stage: 2
      theta: ${{ inputs.theta }}
      law: ${{ inputs.law }}
      contact_regions: ${{ inputs.contact_regions }}
      load_transits: ${{ inputs.load_transits }}
      size: ${{ inputs.size }}
      parent_receipt: ${{ needs.first.outputs.receipt_sha }}
  third:
    needs: second
    uses: ./.github/workflows/triaxial-segment-job.yml
    with:
      mode: ${{ inputs.mode }}
      stage: 3
      theta: ${{ inputs.theta }}
      law: ${{ inputs.law }}
      contact_regions: ${{ inputs.contact_regions }}
      load_transits: ${{ inputs.load_transits }}
      size: ${{ inputs.size }}
      parent_receipt: ${{ needs.second.outputs.receipt_sha }}
  finalize:
    needs: third
    uses: ./.github/workflows/triaxial-segment-job.yml
    with:
      mode: ${{ inputs.mode }}
      stage: 4
      theta: ${{ inputs.theta }}
      law: ${{ inputs.law }}
      contact_regions: ${{ inputs.contact_regions }}
      load_transits: ${{ inputs.load_transits }}
      size: ${{ inputs.size }}
      parent_receipt: ${{ needs.third.outputs.receipt_sha }}
