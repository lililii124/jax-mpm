name: fresh linear metal bounded f8 prefix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metal-linear-full-${{ github.sha }}
  cancel-in-progress: false
jobs:
  solve:
    if: github.ref == 'refs/heads/work/metal-linear-full'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install pinned numerical runtime
        run: |
          python -m pip install numpy==2.5.4 jax==0.12.0.1 jaxlib==0.12.0.1 psutil==7.2.2
          python -m pip install --no-deps -e .
      - name: Fresh source bound t0 to f8 bounded first prefix
        run: python tools/run_metal_linear_full.py --wall-seconds-per-segment 5100 --stop-frame 8
      - name: Package whole raw even after failed solve
        if: always()
        id: package
        timeout-minutes: 10
        run: |
          python tools/run_metal_linear_full.py package
          echo "manifest_sha=$(sha256sum .local/metal-linear-delivery/transport.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-linear-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/metal-linear-delivery/transport.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/metal-linear-delivery/part-000.tarpart') != ''
        timeout-minutes: 3
        with:
          name: metal-linear-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/metal-linear-delivery/part-000.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/metal-linear-delivery/part-001.tarpart') != ''
        timeout-minutes: 3
        with:
          name: metal-linear-${{ github.run_id }}-${{ github.run_attempt }}-part-001
          path: .local/metal-linear-delivery/part-001.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
