name: Hierarchical wave reference segment

on:
  workflow_dispatch:
    inputs:
      stop_step:
        type: string
        default: '600'
      parent_run:
        type: string
        default: '40177065162'
      parent_artifact:
        type: string
        default: '12592112769'
      parent_source:
        type: string
        default: 'ff5413e28e467887b47b8419b4d0cc2d2f3ade55'
      parent_digest:
        type: string
        default: 'b30fa95dc344aa7d2de1420c7d33fb6813b1ea179179d6405c283fa7d700ee8b'
      parent_checkpoint:
        type: string
        default: 'ddfdf2bfb456e690b3343590de059d38ff10e1399e05e2ab67d204dc979f32aa'

permissions:
  contents: read
  actions: read

concurrency:
  group: hierarchical-wave-segment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      STOP_STEP: ${{ inputs.stop_step }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned CPU environment
        timeout-minutes: 10
        run: python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 numpy==2.5.4 scipy==1.18.1 ml-dtypes==0.6.0 opt-einsum==3.4.0 psutil==7.2.2 pillow==13.0.0
      - name: Restore the audited parent segment
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN: ${{ inputs.parent_run }}
          PARENT_ARTIFACT: ${{ inputs.parent_artifact }}
          PARENT_SOURCE: ${{ inputs.parent_source }}
          PARENT_DIGEST: ${{ inputs.parent_digest }}
          PARENT_CHECKPOINT: ${{ inputs.parent_checkpoint }}
        run: >-
          python tools/restore_wave_artifact.py --run "$PARENT_RUN" --artifact "$PARENT_ARTIFACT"
          --source "$PARENT_SOURCE" --sha256 "$PARENT_DIGEST" --checkpoint-sha256 "$PARENT_CHECKPOINT"
          --output .parent-wave --receipt outputs/hierarchical-wave-segment/parent-artifact-verification.json
      - name: Continue the same material-point state
        timeout-minutes: 72
        run: >-
          python tools/run_hierarchical_wave_reference.py
          --coarse-cells 300 --batch-size 4096 --transverse-padding-cells 4
          --stop-after-steps "$STOP_STEP" --seconds-limit 4200 --output-name hierarchical-wave-segment
          --resume-from .parent-wave/data
      - name: Preserve full state and cumulative step history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-wave-segment-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/hierarchical-wave-segment/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
