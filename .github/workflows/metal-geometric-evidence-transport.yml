name: Lossless geometric evidence transport only
on:
  workflow_dispatch:
    inputs:
      source_run:
        required: true
        type: string
      artifact:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: geometric-evidence-transport
  cancel-in-progress: false
jobs:
  transport:
    if: github.ref == 'refs/heads/work/metal-geometric-evidence-transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Verify complete original ZIP and preserve unchanged original parts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ARTIFACT: ${{ inputs.artifact }}
        run: python -m tools.repack_geometric_evidence --run "$SOURCE_RUN" --artifact "$SOURCE_ARTIFACT" --output transfer
      - uses: actions/upload-artifact@v4
        with:
          name: geometric-evidence-${{ inputs.source_run }}-${{ github.run_id }}-metadata
          path: transfer/*.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: hashFiles('transfer/part-000.tarpart') != ''
        with:
          name: geometric-evidence-${{ inputs.source_run }}-${{ github.run_id }}-part000
          path: transfer/part-000.tarpart
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
