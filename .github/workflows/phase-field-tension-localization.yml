name: AT2 discrete precrack tension localization pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: at2-tension-localization
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/work/phase-field-tension-localization'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install frozen runtime
        run: python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 numpy==2.5.4 scipy==1.18.1 ml-dtypes==0.6.0 opt-einsum==3.4.0
      - name: Preserve source and runtime
        run: |
          mkdir -p outputs/tension
          git rev-parse HEAD > outputs/tension/source-head.txt
          python -m pip freeze > outputs/tension/runtime.txt
      - name: Exact carry parity and bounded first loading-wave segment
        timeout-minutes: 40
        run: |
          set -euo pipefail
          timeout --signal=KILL 39m python tools/run_phase_field_tension_localization.py --output outputs/tension/proof 2>&1 | tee outputs/tension/proof.log
      - name: Preserve all raw fields and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at2-tension-localization-${{ github.run_id }}
          path: outputs/tension/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
