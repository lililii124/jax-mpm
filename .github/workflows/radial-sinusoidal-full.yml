name: feature radial sinusoidal full numerical run
on:
  workflow_dispatch:
    inputs:
      stop_after_frame:
        description: Fresh bounded f10 admission prefix or full f50 protocol
        type: choice
        options: ['10', '50']
        default: '10'
        required: true
      continuation_cache_key:
        description: Exact accepted-prefix cache key; empty means fresh t0
        type: string
        default: ''
      parent_receipt_sha256:
        description: Exact accepted-prefix receipt SHA256 for continuation
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: radial-sinusoidal-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Install exact numerical runtime
        timeout-minutes: 10
        run: |
          python -m pip install -r tools/radial_sinusoidal_runtime.txt
          python -m pip install --no-deps -e .
      - name: Admit whole raw packaging and same-run retrieval disk budget
        run: |
          python - <<'PY'
          import shutil,subprocess
          if shutil.disk_usage('.').free < 32*1024**3:
              subprocess.run(['sudo','rm','-rf','--','/usr/local/lib/android','/usr/share/dotnet'],check=True)
          assert shutil.disk_usage('.').free >= 32*1024**3
          PY
      - name: Restore only an explicitly selected accepted prefix for continuation
        if: inputs.continuation_cache_key != ''
        uses: actions/cache/restore@v5
        with:
          path: .local/radial-sinusoidal-full
          key: ${{ inputs.continuation_cache_key }}
          fail-on-cache-miss: true
      - name: Stage the exact restored parent away from the fresh destination
        if: inputs.continuation_cache_key != ''
        env:
          PARENT_SHA: ${{ inputs.parent_receipt_sha256 }}
        run: python tools/radial_sinusoidal_cloud.py stage-parent
      - name: Fresh bounded f10 or explicitly requested full f50 protocol
        id: solve
        timeout-minutes: 245
        env:
          STOP_AFTER_FRAME: ${{ inputs.stop_after_frame }}
          CONTINUATION_KEY: ${{ inputs.continuation_cache_key }}
          PARENT_SHA: ${{ inputs.parent_receipt_sha256 }}
        run: |
          if [ -n "$CONTINUATION_KEY" ]; then
            python tools/radial_sinusoidal_cloud.py run --stop-after-frame "$STOP_AFTER_FRAME" --continue-from .local/radial-sinusoidal-resume-input --parent-receipt-sha256 "$PARENT_SHA"
          else
            python tools/radial_sinusoidal_cloud.py run --stop-after-frame "$STOP_AFTER_FRAME"
          fi
      - name: Preserve exact same-run raw cache including failed endpoint
        if: always() && steps.solve.outputs.cache_key != ''
        timeout-minutes: 10
        uses: actions/cache/save@v5
        with:
          path: .local/radial-sinusoidal-full
          key: ${{ steps.solve.outputs.cache_key }}
      - name: Package complete raw and failure receipts
        if: always()
        timeout-minutes: 10
        run: python tools/radial_sinusoidal_cloud.py package
      - uses: actions/upload-artifact@v4
        if: always()
        id: manifest
        with:
          name: radial-raw-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/radial-sinusoidal-parts/transport.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/radial-sinusoidal-parts/part-000.tarpart') != ''
        id: part000
        timeout-minutes: 3
        with:
          name: radial-raw-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/radial-sinusoidal-parts/part-000.tarpart
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
