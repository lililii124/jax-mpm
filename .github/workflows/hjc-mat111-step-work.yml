name: Bounded HJC step boundary work diagnostic
on:
  workflow_dispatch:
    inputs:
      grid_comparison_only:
        type: choice
        options: ['false','true']
        default: 'false'
      frozen_review_only:
        type: choice
        options: ['false','true']
        default: 'false'
      frozen_transfer_only:
        type: choice
        options: ['false','true']
        default: 'false'
      review_specification:
        type: string
        default: ''
        description: Exact diagnostic archive metadata JSON for zero-step review
      time_step_divisor:
        type: choice
        options: ['1','2']
        default: '1'
      review_only:
        type: choice
        options: ['false','true']
        default: 'false'
permissions:
  contents: read
  actions: read
concurrency:
  group: hjc-step-work-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: inputs.review_only != 'true' && inputs.frozen_transfer_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      TIME_STEP_DIVISOR: ${{ inputs.time_step_divisor }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Frozen original core material geometry source gate
        run: |
          git fetch --no-tags --depth=1 origin d857cec8d682446a1f4821ebd0fb3b713ef761a2
          git diff --exit-code d857cec8d682446a1f4821ebd0fb3b713ef761a2 HEAD -- mpm_jax
          test "$(git diff --name-only d857cec8d682446a1f4821ebd0fb3b713ef761a2 HEAD -- examples)" = "examples/brittle_engineering.py"
      - name: Pinned original CPU environment
        run: python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 numpy==2.5.4 scipy==1.18.1 ml-dtypes==0.6.0 opt-einsum==3.4.0 psutil==7.2.2 pillow==13.0.0
      - name: Download and completely authenticate original frame40 archive and source
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json,os
          import tools.audit_hjc_complete_prefix as audit
          output=Path('.local/hjc-step-work/input')
          output.mkdir(parents=True)
          parent,receipt=audit.official_archive('f40',audit.CHILD,output)
          state=audit.provenance_and_state(parent,audit.CHILD)
          assert audit.sha(parent/'prefix-review.json') == '1a540c6bc4755f85394d4a8c5da3ead023989fa8060d3a5e4ab0d3b479624fc4'
          (output/'admission.json').write_text(json.dumps(dict(passed=True,commit=os.environ['GITHUB_SHA'],original_core_unchanged=True,example_change_scope='Explicit time divisor is passed into config before observer creation; default factory checked against original Git blob in worker',parent_archive=receipt,parent_min_J=state['min_J']),indent=2))
          PYCODE
      - name: Same config actual step work startup8 and damaged frame40 plus64 no full rerun
        run: python tools/probe_hjc_step_work.py --output .local/hjc-step-work/probe --parent .local/hjc-step-work/input/f40/restored --time-step-divisor "$TIME_STEP_DIVISOR"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hjc-step-work-bounded-${{ github.run_id }}
          path: |
            .local/hjc-step-work/probe/
            .local/hjc-step-work/resource-guard.json
            .local/hjc-step-work/worker.log
            .local/hjc-step-work/input/admission.json
            .local/hjc-step-work/input/f40/archive-review.json
          if-no-files-found: error
          compression-level: 6
  review:
    if: inputs.review_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      REVIEW_SPECIFICATION: ${{ inputs.review_specification }}
      FROZEN_REVIEW: ${{ inputs.frozen_review_only }}
      GRID_COMPARISON: ${{ inputs.grid_comparison_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Fetch exact source parents and pure NumPy only
        run: |
          git fetch --no-tags --depth=1 origin d857cec8d682446a1f4821ebd0fb3b713ef761a2
          git fetch --no-tags --depth=1 origin b2c74c97a9cfad65656ea8be516cb80fa7994d37
          python -m pip install numpy==2.5.4
      - name: Whole official ZIP digest CRC true work fields zero integration
        run: |
          python - <<'PYCODE'
          import json,os,pathlib,subprocess,sys
          if os.environ.get('FROZEN_REVIEW')=='true':
              if os.environ.get('GRID_COMPARISON')=='true':
                  commit='24bd5850e11537899bc9476830fc28a5744a6271'
                  script='tools/review_hjc_transfer_grids.py'
                  output='.local/hjc-frozen-grid-independent'
              else:
                  commit='e53dfd5f30503f056131088333edcc63dcdb11e9'
                  script='tools/review_hjc_frozen_transfer.py'
                  output='.local/hjc-frozen-transfer-independent'
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',commit],check=True)
              subprocess.run([sys.executable,script,'--output',output],check=True)
              sys.exit(0)
          raw=os.environ.get('REVIEW_SPECIFICATION','')
          command=[sys.executable,'tools/review_hjc_step_work.py','--output','.local/hjc-step-work-independent']
          if raw:
              spec=json.loads(raw)
              commit=spec['commit']
              assert len(commit)==40 and all(x in '0123456789abcdef' for x in commit)
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',commit],check=True)
              pathlib.Path('.local').mkdir(exist_ok=True)
              path=pathlib.Path('.local/step-work-review-spec.json')
              path.write_text(raw)
              command+=['--specification',str(path)]
          subprocess.run(command,check=True)
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hjc-step-work-independent-${{ github.run_id }}
          path: |
            .local/hjc-step-work-independent/independent-step-work-review.json
            .local/hjc-step-work-independent/diagnostic/archive-review.json
            .local/hjc-frozen-transfer-independent/independent-frozen-transfer-review.json
            .local/hjc-frozen-transfer-independent/*/archive-review.json
            .local/hjc-frozen-grid-independent/independent-frozen-grid-review.json
            .local/hjc-frozen-grid-independent/*/archive-review.json
          if-no-files-found: warn
  frozen-transfer:
    if: inputs.frozen_transfer_only == 'true' && inputs.review_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Original core transfer source unchanged
        run: |
          git fetch --no-tags --depth=1 origin d857cec8d682446a1f4821ebd0fb3b713ef761a2
          git diff --exit-code d857cec8d682446a1f4821ebd0fb3b713ef761a2 HEAD -- mpm_jax
      - name: Pinned CPU environment
        run: python -m pip install jax==0.12.0.1 jaxlib==0.12.0.1 numpy==2.5.4 scipy==1.18.1 ml-dtypes==0.6.0 opt-einsum==3.4.0 psutil==7.2.2 pillow==13.0.0
      - name: Authenticate complete frame40 original archive source and state
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import tools.audit_hjc_complete_prefix as audit
          output=Path('.local/hjc-frozen-transfer/input')
          output.mkdir(parents=True)
          parent,receipt=audit.official_archive('f40',audit.CHILD,output)
          state=audit.provenance_and_state(parent,audit.CHILD)
          assert audit.sha(parent/'prefix-review.json')=='1a540c6bc4755f85394d4a8c5da3ead023989fa8060d3a5e4ab0d3b479624fc4'
          PYCODE
      - name: Frozen force-free actual APIC transfer and boundary isolation zero physical steps
        env:
          GRID_COMPARISON: ${{ inputs.grid_comparison_only }}
        run: |
          python - <<'PYCODE'
          import os,subprocess,sys
          command=[sys.executable,'tools/probe_hjc_frozen_transfer.py','--output','.local/hjc-frozen-transfer/probe','--parent','.local/hjc-frozen-transfer/input/f40/restored']
          if os.environ.get('GRID_COMPARISON')=='true':
              command.append('--grid-comparison')
          subprocess.run(command,check=True)
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hjc-frozen-transfer-${{ github.run_id }}
          path: |
            .local/hjc-frozen-transfer/probe/
            .local/hjc-frozen-transfer/worker.log
            .local/hjc-frozen-transfer/resource-guard.json
            .local/hjc-frozen-transfer/input/f40/archive-review.json
          if-no-files-found: warn
