name: triaxial dynamic studies

on:
  workflow_dispatch:
    inputs:
      theta:
        description: Load angle relative to the reference fibre family
        type: choice
        options: ['0', '5', '10', '15', '20', '25', '30']
        default: '0'
        required: true
      law:
        description: Frictionless contact law
        type: choice
        options: [hertz, jkr]
        default: hertz
        required: true
      load_transits:
        description: Positive loading transit count, at most 100; common choices 10, 20, 40
        type: string
        default: '10'
        required: true
      size:
        description: Coupon length x width in mm; 3 mm grips on each end
        type: choice
        options: [20x14, 24x16, 28x18]
        default: 24x16
        required: true

permissions:
  contents: read

concurrency:
  group: triaxial-study-${{ github.ref }}-${{ inputs.theta }}-${{ inputs.law }}-${{ inputs.load_transits }}-${{ inputs.size }}
  cancel-in-progress: false

jobs:
  numerical-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUNBUFFERED: '1'
      STUDY_THETA: ${{ inputs.theta }}
      STUDY_LAW: ${{ inputs.law }}
      STUDY_LOAD_TRANSITS: ${{ inputs.load_transits }}
      STUDY_SIZE: ${{ inputs.size }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU and rendering dependencies
        timeout-minutes: 30
        run: python tools/install_runner_dependencies.py --log-dir .local/triaxial-study-ci
      - name: Install official ParaView
        timeout-minutes: 15
        run: python tools/run_triaxial_study.py install
      - name: Complete protocol, independently review and render
        timeout-minutes: 295
        run: >-
          python tools/run_triaxial_study.py run
          --theta "$STUDY_THETA" --law "$STUDY_LAW"
          --load-transits "$STUDY_LOAD_TRANSITS" --size "$STUDY_SIZE"
      - name: Preserve bounded diagnostics even after interruption
        if: always()
        timeout-minutes: 6
        run: >-
          python tools/run_triaxial_study.py --package-only
          --theta "$STUDY_THETA" --law "$STUDY_LAW"
          --load-transits "$STUDY_LOAD_TRANSITS" --size "$STUDY_SIZE"
      - name: Upload reviewed evidence and available animation without publication
        if: always()
        timeout-minutes: 9
        uses: actions/upload-artifact@v4
        with:
          name: triaxial-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/triaxial-study-delivery/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
