name: Private v6 energy125to135ns original-probe admission
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: metal-v6-numerical-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    if: github.ref == 'refs/heads/work/metal-fragment-v6-cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Restore exact preserved125ns from frozen whole seed, without integration
        timeout-minutes: 10
        run: python tools/run_metal_v6_probe125.py restore
      - name: Install exact producer JAX code wheel and pinned platform dependencies
        timeout-minutes: 10
        run: python tools/run_metal_v6_probe125.py install
      - name: Compare original and diagnosed125to135ns steps with unchanged physical gates
        timeout-minutes: 32
        run: python tools/run_metal_v6_probe125.py run
      - name: Preserve whole raw even failed or resource-stopped
        if: always()
        id: package
        timeout-minutes: 10
        run: |
          python tools/run_metal_v6_probe125.py package
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          sha=hashlib.sha256(Path('.local/metal-v6-probe125-delivery/transport.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('manifest_sha='+sha+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        id: upload_manifest
        with:
          name: metal-v6-recovery-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/metal-v6-probe125-delivery/transport.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/metal-v6-probe125-delivery/part-000.tarpart') != ''
        id: upload_part_000
        timeout-minutes: 3
        with:
          name: metal-v6-recovery-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/metal-v6-probe125-delivery/part-000.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/metal-v6-probe125-delivery/part-001.tarpart') != ''
        id: upload_part_001
        timeout-minutes: 3
        with:
          name: metal-v6-recovery-${{ github.run_id }}-${{ github.run_attempt }}-part-001
          path: .local/metal-v6-probe125-delivery/part-001.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
