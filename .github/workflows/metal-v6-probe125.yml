          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.local/metal-v6-probe125-delivery/part-015.tarpart') != ''
        id: upload_part_015
        timeout-minutes: 3
        with:
          name: metal-v6-recovery-${{ github.run_id }}-${{ github.run_attempt }}-part-015
          path: .local/metal-v6-probe125-delivery/part-015.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/download-artifact@v5
        if: always()
        timeout-minutes: 10
        with:
          pattern: metal-v6-recovery-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .local/metal-v6-cloud-retrieved/
          merge-multiple: true
      - name: Verify pre-upload original manifest, all parts and every whole raw file
        if: always()
        timeout-minutes: 10
        env:
          EXPECTED_MANIFEST: ${{ steps.package.outputs.manifest_sha }}
        run: python tools/run_metal_v6_probe125.py verify-retrieval --folder .local/metal-v6-cloud-retrieved --expected "$EXPECTED_MANIFEST"
      - name: Record immutable recovery transport handles and checkpoint status
        if: always()
        env:
          MANIFEST_ID: ${{ steps.upload_manifest.outputs.artifact-id }}
          MANIFEST_SHA: ${{ steps.upload_manifest.outputs.artifact-digest }}
          PART_000_ID: ${{ steps.upload_part_000.outputs.artifact-id }}
          PART_000_SHA: ${{ steps.upload_part_000.outputs.artifact-digest }}
          PART_001_ID: ${{ steps.upload_part_001.outputs.artifact-id }}
          PART_001_SHA: ${{ steps.upload_part_001.outputs.artifact-digest }}
          PART_002_ID: ${{ steps.upload_part_002.outputs.artifact-id }}
          PART_002_SHA: ${{ steps.upload_part_002.outputs.artifact-digest }}
          PART_003_ID: ${{ steps.upload_part_003.outputs.artifact-id }}
          PART_003_SHA: ${{ steps.upload_part_003.outputs.artifact-digest }}
          PART_004_ID: ${{ steps.upload_part_004.outputs.artifact-id }}
          PART_004_SHA: ${{ steps.upload_part_004.outputs.artifact-digest }}
          PART_005_ID: ${{ steps.upload_part_005.outputs.artifact-id }}
          PART_005_SHA: ${{ steps.upload_part_005.outputs.artifact-digest }}
          PART_006_ID: ${{ steps.upload_part_006.outputs.artifact-id }}
          PART_006_SHA: ${{ steps.upload_part_006.outputs.artifact-digest }}
          PART_007_ID: ${{ steps.upload_part_007.outputs.artifact-id }}
          PART_007_SHA: ${{ steps.upload_part_007.outputs.artifact-digest }}
          PART_008_ID: ${{ steps.upload_part_008.outputs.artifact-id }}
          PART_008_SHA: ${{ steps.upload_part_008.outputs.artifact-digest }}
          PART_009_ID: ${{ steps.upload_part_009.outputs.artifact-id }}
          PART_009_SHA: ${{ steps.upload_part_009.outputs.artifact-digest }}
          PART_010_ID: ${{ steps.upload_part_010.outputs.artifact-id }}
          PART_010_SHA: ${{ steps.upload_part_010.outputs.artifact-digest }}
          PART_011_ID: ${{ steps.upload_part_011.outputs.artifact-id }}
          PART_011_SHA: ${{ steps.upload_part_011.outputs.artifact-digest }}
          PART_012_ID: ${{ steps.upload_part_012.outputs.artifact-id }}
          PART_012_SHA: ${{ steps.upload_part_012.outputs.artifact-digest }}
          PART_013_ID: ${{ steps.upload_part_013.outputs.artifact-id }}
          PART_013_SHA: ${{ steps.upload_part_013.outputs.artifact-digest }}
          PART_014_ID: ${{ steps.upload_part_014.outputs.artifact-id }}
          PART_014_SHA: ${{ steps.upload_part_014.outputs.artifact-digest }}
          PART_015_ID: ${{ steps.upload_part_015.outputs.artifact-id }}
          PART_015_SHA: ${{ steps.upload_part_015.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT'];prefix=f'metal-v6-recovery-{run}-{attempt}'
          records=[]
          if os.environ['MANIFEST_ID']:records.append(dict(id=int(os.environ['MANIFEST_ID']),name=prefix+'-manifest',sha256=os.environ['MANIFEST_SHA']))
          for i in range(16):
              if os.environ[f'PART_{i:03}_ID']:records.append(dict(id=int(os.environ[f'PART_{i:03}_ID']),name=prefix+f'-part-{i:03}',sha256=os.environ[f'PART_{i:03}_SHA']))
          receipt=Path('.local/metal-v6-probe125/raw/run-receipt.json')
          value=dict(run_id=run,attempt=attempt,commit=os.environ['GITHUB_SHA'],artifacts=records,run_receipt=json.loads(receipt.read_text()) if receipt.exists() else None)
          Path('.local/metal-v6-recovery-artifact-receipt.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-v6-recovery-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/metal-v6-recovery-artifact-receipt.json
            .local/metal-v6-cloud-retrieved/retrieval-receipt.json
            .local/metal-v6-probe125/raw/run-receipt.json
          if-no-files-found: warn
          retention-days: 30
