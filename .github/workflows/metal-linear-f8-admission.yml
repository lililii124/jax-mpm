name: Read-only linear metal f8 whole raw admission
permissions:
  contents: read
  actions: read
concurrency:
  group: metal-linear-continuation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  solve:
    if: github.ref == 'refs/heads/work/metal-linear-full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: 3.12.13
    - name: Install pinned numerical runtime
      run: 'python -m pip install numpy==2.5.4 jax==0.12.0.1 jaxlib==0.12.0.1 psutil==7.2.2

        python -m pip install --no-deps -e .

        '
    - name: Read-only full artifact source runtime and saved-state admission
      env:
        GH_TOKEN: ${{ github.token }}
      run: python tools/admit_metal_linear_f8.py
      timeout-minutes: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linear-metal-f8-independent-admission-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: '.local/metal-linear-continuation/independent-admission.json

          .local/metal-linear-continuation/lineage.json'
        if-no-files-found: error
        retention-days: 30
'on':
  workflow_dispatch: {}
