name: Private RHT explicit measured-resource original-arm qualification

on:
  workflow_dispatch:
    inputs:
      arm:
        type: choice
        options: [original, no-warmup]
        default: original
        required: true
      weekly_used:
        description: Fresh publisher-confirmed weekly Codex percentage below90
        type: string
        required: true
      runner:
        description: Experimental policy >=2 effectiveCPUs/>=4GiB available; strict3GiB owned-session USS
        type: string
        default: ubuntu-24.04
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rht-impact-continue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prefix:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      QUAL_ARM: ${{ inputs.arm }}
      WEEKLY_USED: ${{ inputs.weekly_used }}
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Bind wrapper and experimentally qualify resource policy
        run: |
          git diff --exit-code HEAD -- tools/rht_resume_qualification.py tools/rht_qualification_child.py .github/workflows/rht-resume-qualification.yml .github/workflows/engineering-previews.yml
          cmp .github/workflows/rht-resume-qualification.yml .github/workflows/engineering-previews.yml
          python -m pip install psutil==7.2.2
          python -c "from tools.rht_resume_qualification import snapshot,admission; print(admission(snapshot(),'measured-experimental'))"
      - name: Retrieve immutable original transport and all raw parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '40071417301'
          pattern: rht-impact-prefix-40071417301-1-*
          merge-multiple: true
          path: .local/rht-parent-transport
      - name: Retrieve original same-run full raw receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '40071417301'
          name: rht-impact-retrieval-40071417301-1
          path: .local/rht-parent-transport
      - name: Install complete original pinned numerical environment
        timeout-minutes: 15
        run: |
          python -m tools.rht_impact_continue requirements --parent .local/rht-parent-transport --destination .local/rht-parent-requirements.txt
          python -m pip install -r .local/rht-parent-requirements.txt
          python -m pip install --no-deps -e .
      - name: Admit original full raw and qualify exact plan through frame 4
        timeout-minutes: 190
        run: python -m tools.rht_resume_qualification arm --parent .local/rht-parent-transport --destination .local/rht-impact-continuation --arm "$QUAL_ARM" --policy measured-experimental --weekly-used "$WEEKLY_USED"
      - name: Package complete raw including failure evidence
        id: package
        if: always()
        timeout-minutes: 15
        run: |
          python -m tools.rht_impact_continue package --destination .local/rht-impact-continuation --delivery .local/rht-impact-delivery
          python - <<'PYCODE'
          import hashlib,os
          from pathlib import Path
          value=hashlib.sha256(Path('.local/rht-impact-delivery/transport.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('manifest_sha='+value+'\n')
          PYCODE
      - name: Upload transport manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rht-impact-prefix-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: .local/rht-impact-delivery/transport.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload raw part 000 bounded to 128 MiB
        if: always() && hashFiles('.local/rht-impact-delivery/part-000.tarpart') != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: rht-impact-prefix-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: .local/rht-impact-delivery/part-000.tarpart
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
