        uses: actions/upload-artifact@v4
        with:
          name: rht-impact-retrieval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/rht-impact-retrieved/retrieval-receipt.json
          if-no-files-found: warn
          retention-days: 7
