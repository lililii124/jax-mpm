name: Private deep woven f2 read-only admission
permissions:
  contents: read
concurrency:
  group: woven-deep-f10-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: 3.12.13
    - name: Install and record exact numerical runtime
      timeout-minutes: 10
      run: 'python -m pip install numpy==2.5.4 jax==0.12.0.1 jaxlib==0.12.0.1 psutil==7.2.2

        python -m pip install --no-deps -e .

        '
    - name: Retrieve immutable accepted parent run only
      uses: actions/download-artifact@v5
      with:
        github-token: ${{ github.token }}
        run-id: 40089103544
        pattern: woven-deep-prefix-40089103544-1-*
        path: .local/woven-deep-parent/
        merge-multiple: true
    - name: Independently audit all restored parent bytes without a solver
      run: python tools/run_woven_deep_f10.py review-only
      timeout-minutes: 20
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: woven-deep-f2-admission-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: '.local/woven-deep-f10/independent-admission.json

          .local/woven-deep-f10/parent-admission.json

          .local/woven-deep-f10/source.json'
        if-no-files-found: error
        retention-days: 30
'on':
  workflow_dispatch: {}
