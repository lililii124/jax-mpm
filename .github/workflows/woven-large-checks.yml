name: large woven plate resource checks

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Fully infiltrated woven architecture
        type: choice
        options: [plain, triaxial, twill-2x2]
        default: plain
        required: true
      loading:
        description: Fixed large-plate protocol; run only its first 128 steps
        type: choice
        options: [sphere-impact, hemisphere-indentation, pressure-bending]
        default: sphere-impact
        required: true

permissions:
  contents: read

concurrency:
  group: large-woven-resource-check
  cancel-in-progress: false

jobs:
  resource-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PLATE_ARCHITECTURE: ${{ inputs.architecture }}
      PLATE_LOADING: ${{ inputs.loading }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the fixed CPU package
        timeout-minutes: 10
        run: python -m pip install -e . psutil
      - name: Measure full-size prefix with memory guard and independent review
        timeout-minutes: 77
        run: >-
          python tools/run_woven_large.py probe
          --architecture "$PLATE_ARCHITECTURE" --case "$PLATE_LOADING"
      - name: Preserve bounded complete diagnostic files
        if: always()
        timeout-minutes: 6
        run: >-
          python tools/run_woven_large.py package
          --architecture "$PLATE_ARCHITECTURE" --case "$PLATE_LOADING"
      - name: Upload private review evidence without publication
        if: always()
        timeout-minutes: 7
        uses: actions/upload-artifact@v4
        with:
          name: woven-large-probe-${{ inputs.architecture }}-${{ inputs.loading }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/woven-large-delivery/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
