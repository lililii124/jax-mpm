name: triaxial fibre checks

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Large memory probe or small full-duration contact integration
        type: choice
        options: [probe, smoke]
        default: probe
        required: true
      law:
        description: Frictionless contact law
        type: choice
        options: [hertz, jkr]
        default: hertz
        required: true
      theta:
        description: Loading direction relative to the reference fibre family
        type: choice
        options: ['0', '5', '10', '15', '20', '25', '30']
        default: '0'
        required: true

permissions:
  contents: read

concurrency:
  group: triaxial-checks-${{ github.ref }}-${{ inputs.preset }}-${{ inputs.law }}-${{ inputs.theta }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        timeout-minutes: 15
        run: python -m pip --disable-pip-version-check --timeout 60 --retries 3 install -e . psutil
      - name: Run guarded check
        timeout-minutes: 130
        run: python tools/run_triaxial_checks.py --preset ${{ inputs.preset }} --law ${{ inputs.law }} --theta ${{ inputs.theta }}
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triaxial-check-${{ inputs.preset }}-${{ inputs.law }}-${{ inputs.theta }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/triaxial-delivery/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
