name: feature radial sinusoidal continuation media
on:
  workflow_dispatch:
    inputs:
      raw_run_id:
        description: Exact completed dual-controller continuation run ID
        type: string
        required: true
      raw_run_attempt:
        description: Exact continuation run attempt
        type: string
        default: '1'
        required: true
      numerical_controller_sha:
        description: Exact numerical continuation controller commit SHA (40 hex)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: radial-sinusoidal-dual-media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    env:
      RAW_RUN_ID: ${{ inputs.raw_run_id }}
      RAW_RUN_ATTEMPT: ${{ inputs.raw_run_attempt }}
      NUMERICAL_CONTROLLER_SHA: ${{ inputs.numerical_controller_sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Validate immutable selectors
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9]+',os.environ['RAW_RUN_ID'])
          assert re.fullmatch(r'[0-9]+',os.environ['RAW_RUN_ATTEMPT'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['NUMERICAL_CONTROLLER_SHA'])
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: de2bfea446e66e6245e33329a663996c5d5b9e84
          path: .local/radial-immutable-producer
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.numerical_controller_sha }}
          path: .local/radial-numerical-controller
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - name: Admit full multipart extract and read-only rendering disk budget
        run: |
          python - <<'PY'
          import shutil,subprocess
          if shutil.disk_usage('.').free < 32*1024**3:
              subprocess.run(['sudo','rm','-rf','--','/usr/local/lib/android','/usr/share/dotnet'],check=True)
          assert shutil.disk_usage('.').free >= 32*1024**3
          PY
      - name: Retrieve exact independent prefix admission proof
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: '40092005172'
          artifact-ids: '12559346521'
          path: .local/radial-independent-proof
          merge-multiple: true
      - name: Record exact immutable continuation artifact identities
        uses: actions/github-script@v7
        env:
          ARTIFACT_RUN: ${{ inputs.raw_run_id }}
          ARTIFACT_ATTEMPT: ${{ inputs.raw_run_attempt }}
          EXPECTED_NUMERICAL_SHA: ${{ inputs.numerical_controller_sha }}
        with:
          script: |
            const fs=require('fs');
            const run_id=Number(process.env.ARTIFACT_RUN);
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
            if(run.head_sha!==process.env.EXPECTED_NUMERICAL_SHA) throw new Error('Numerical controller SHA differs');
            const prefix=`radial-cont-raw-${run_id}-${process.env.ARTIFACT_ATTEMPT}-`;
            const all=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id,per_page:100});
            const artifacts=all.filter(x=>x.name.startsWith(prefix));
            if(!artifacts.length || artifacts.some(x=>x.expired)) throw new Error('Complete continuation raw unavailable');
            fs.mkdirSync('.local',{recursive:true});
            fs.writeFileSync('.local/radial-cont-artifact-identities.json',JSON.stringify({run_id,attempt:process.env.ARTIFACT_ATTEMPT,head_sha:run.head_sha,workflow_path:run.path,conclusion:run.conclusion,artifacts:artifacts.map(x=>({id:x.id,name:x.name,size_in_bytes:x.size_in_bytes,digest:x.digest}))},null,2));
      - name: Retrieve exact continuation run multipart artifacts
        uses: actions/download-artifact@v5
        timeout-minutes: 20
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw_run_id }}
          pattern: radial-cont-raw-${{ inputs.raw_run_id }}-${{ inputs.raw_run_attempt }}-*
          path: .local/radial-continuation-input
          merge-multiple: true
      - name: Verify full transport and safely extract exact numerical evidence
        timeout-minutes: 10
        run: python tools/radial_sinusoidal_continuation.py extract --folder .local/radial-continuation-input
      - name: Install immutable renderer dependencies and actual ParaView
        timeout-minutes: 20
        run: |
          python -m pip install -r .local/radial-immutable-producer/tools/radial_sinusoidal_runtime.txt
          python -m pip install --no-deps -e .local/radial-immutable-producer
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libosmesa6
          python tools/radial_sinusoidal_continuation.py install
      - name: Render only the exact51 saved states and verify unchanged numerical bytes
        timeout-minutes: 85
        run: python tools/radial_sinusoidal_continuation.py media
      - uses: actions/upload-artifact@v4
        id: upload
        timeout-minutes: 10
        with:
          name: radial-cont-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/radial-continuation-media/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/download-artifact@v5
        timeout-minutes: 10
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: .local/radial-continuation-media-retrieved
          merge-multiple: true
      - name: Verify exact same-run retrieved media artifact bytes
        env:
          MEDIA_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python tools/radial_sinusoidal_continuation.py verify-media --folder .local/radial-continuation-media-retrieved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-cont-media-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/radial-continuation-media-retrieval.json
            .local/radial-continuation-input/retrieval-receipt.json
            .local/radial-immutable-producer/.local/radial-sinusoidal-pv-install/paraview-install.json
          if-no-files-found: warn
          retention-days: 30
