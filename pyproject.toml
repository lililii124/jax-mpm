[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-mpm"
version = "0.1.0"
description = "Differentiable 2D MLS-MPM with JAX"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yu Zheng"}]
requires-python = ">=3.12"
dependencies = ["jax>=0.12.0,<0.13", "numpy>=2.2", "matplotlib>=3.10", "pillow>=11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/lililii124/jax-mpm"
Issues = "https://github.com/lililii124/jax-mpm/issues"

[project.scripts]
jax-mpm = "mpm_jax.cli:main"
mpm-jax = "mpm_jax.cli:main"

[tool.setuptools.packages.find]
include = ["mpm_jax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
