<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Pressure-centre projections on the sandwich plate</title>
  <desc id="desc">Top view of the 300 by 300 millimetre plate. The central Gaussian pressure is centred at 150,150 millimetres; the eccentric Gaussian pressure is centred at 210,105 millimetres. X increases rightwards and Y upwards. Dashed grey lines locate the central X–Z and Y–Z material sections. These are prescribed pressure centres, not a modelled explosive charge.</desc>
  <rect width="400" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#263746" font-size="13">
    <text x="200" y="23" text-anchor="middle" font-size="16">Pressure centres · top view</text>
    <rect x="50" y="50" width="300" height="300" fill="#f4f7fa" stroke="#64748b" stroke-width="2"/>
    <path d="M50 200H350 M200 50V350" fill="none" stroke="#94a3b8" stroke-dasharray="5 5"/>
    <text x="344" y="193" text-anchor="end" fill="#64748b" font-size="11">X–Z</text>
    <text x="207" y="66" fill="#64748b" font-size="11">Y–Z</text>
    <path d="M50 245H260V350" fill="none" stroke="#cb4939" stroke-dasharray="4 4"/>
    <circle cx="200" cy="200" r="5" fill="#2563a0" stroke="white" stroke-width="2"/>
    <text x="190" y="167" text-anchor="middle" fill="#2563a0">Central</text>
    <text x="190" y="183" text-anchor="middle" fill="#2563a0" font-size="12">(150, 150)</text>
    <circle cx="260" cy="245" r="6" fill="#cb4939" stroke="white" stroke-width="2"/>
    <text x="267" y="271" fill="#b13c2e">Eccentric</text>
    <text x="267" y="287" fill="#b13c2e" font-size="12">(210, 105)</text>
    <text x="41" y="249" text-anchor="end" fill="#b13c2e">105</text>
    <text x="260" y="370" text-anchor="middle" fill="#b13c2e">210</text>
    <text x="50" y="370" text-anchor="middle">0</text>
    <text x="350" y="370" text-anchor="middle">300</text>
    <text x="41" y="55" text-anchor="end">300</text>
    <text x="41" y="354" text-anchor="end">0</text>
    <text x="365" y="370">x</text>
    <text x="41" y="40" text-anchor="end">y</text>
    <text x="200" y="393" text-anchor="middle" font-size="12">Dimensions in mm</text>
  </g>
</svg>
